<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Network Visualizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #030712;
            font-family: Georgia, serif;
            letter-spacing: 0.5px;
        }
        #mynetwork {
            width: 100%;
            height: 100%;
            background-color: #030712;
        }
        #toolbar {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            background: rgba(17, 24, 39, 0.95);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #374151;
            display: flex;
            gap: 12px;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        .tool-btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: Georgia, serif;
            font-size: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .tool-btn:hover { background-color: #0369a1; }
        .tool-btn.frozen { background-color: #dc2626; }
        .color-picker-group {
            display: flex;
            align-items: center;
            gap: 5px;
            color: #9ca3af;
            font-size: 11px;
        }
        input[type="color"] {
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }
        #drawer {
            position: absolute;
            top: 70px;
            left: 15px;
            bottom: 60px;
            width: 240px;
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid #374151;
            border-radius: 8px;
            z-index: 9;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }
        #drawer.closed { transform: translateX(-270px); }
        #drawer-header {
            padding: 10px 12px;
            font-weight: bold;
            font-size: 13px;
            color: #38bdf8;
            border-bottom: 1px solid #374151;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #node-list {
            overflow-y: auto;
            flex: 1;
            padding: 6px;
        }
        .node-item {
            padding: 6px 10px;
            font-size: 12px;
            color: #f3f4f6;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .node-item:hover {
            background-color: #1f2937;
            color: #38bdf8;
        }
        #instructions {
            position: absolute;
            bottom: 15px;
            left: 15px;
            color: #9ca3af;
            font-size: 11px;
            pointer-events: none;
            background: rgba(17, 24, 39, 0.9);
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            z-index: 8;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button id="drawer-toggle" class="tool-btn" onclick="toggleDrawer()">📁 Node Locator</button>
        <button id="physics-toggle" class="tool-btn" onclick="togglePhysics()">Freeze Physics: OFF</button>
        <div class="color-picker-group">
            <label>Start:</label>
            <input type="color" id="color-start" value="#3b82f6" onchange="updateColors()">
        </div>
        <div class="color-picker-group">
            <label>End:</label>
            <input type="color" id="color-end" value="#ec4899" onchange="updateColors()">
        </div>
    </div>

    <div id="drawer" class="closed">
        <div id="drawer-header">
            <span>Nodes List</span>
            <span style="cursor:pointer; font-size:14px;" onclick="toggleDrawer()">✕</span>
        </div>
        <div id="node-list"></div>
    </div>

    <div id="mynetwork"></div>
    <div id="instructions">💡 Tip: Click any node to highlight chain. Click background to reset.</div>

ws": {"to": {"enabled": true, "scaleFactor": 1.5}}, "color": {"color": "#475569", "highlight": "#38bdf8"}, "font": {"color": "#f8fafc", "size": 12, "face": "Georgia, serif", "align": "middle", "background": "#0f172a", "strokeWidth": 0}}, {"from": "Assemblies-4", "to": "AssemblyTestChains-4", "label": "Passed", "length": 216, "arrows": {"to": {"enabled": true, "scaleFactor": 1.5}}, "color": {"color": "#475569", "highlight": "#38bdf8"}, "font": {"color": "#f8fafc", "size": 12, "face": "Georgia, serif", "align": "middle", "background": "#0f172a", "strokeWidth": 0}}, {"from": "Assemblies-4", "to": "SubAssemblies-2", "label": "Attached", "length": 248, "arrows": {"to": {"enabled": true, "scaleFactor": 1.5}}, "color": {"color": "#475569", "highlight": "#38bdf8"}, "font": {"color": "#f8fafc", "size": 12, "face": "Georgia, serif", "align": "middle", "background": "#0f172a", "strokeWidth": 0}}];

        var nodes = new vis.DataSet(nodesData);
        var edges = new vis.DataSet(edgesData);

        var container = document.getElementById('mynetwork');
        var data = { nodes: nodes, edges: edges };

        var options = {
            nodes: { borderWidth: 2, shadow: false },
            edges: {
                width: 2,
                smooth: { type: 'cubicBezier', roundness: 0.2 },
                shadow: false
            },
            physics: {
                barnesHut: {
                    gravitationalConstant: -8000,
                    centralGravity: 0.2,
                    springConstant: 0.02,
                    avoidOverlap: 0.5
                },
                stabilization: { enabled: true, iterations: 1000 }
            },
            interaction: { 
                hover: true,
                tooltipDelay: 200,
                hideEdgesOnDrag: true,
                hideNodesOnDrag: false
            }
        };

        var network = new vis.Network(container, data, options);

        function populateNodeList() {
            let listContainer = document.getElementById('node-list');
            listContainer.innerHTML = '';
            let allNodesArr = nodes.get({returnType: "Object"});
            let sortedIds = Object.keys(allNodesArr).sort();

            sortedIds.forEach(id => {
                let item = document.createElement('div');
                item.className = 'node-item';
                item.innerText = id;
                item.onclick = function() { focusOnNode(id); };
                listContainer.appendChild(item);
            });
        }
        populateNodeList();

        function toggleDrawer() {
            document.getElementById('drawer').classList.toggle('closed');
        }

        function focusOnNode(nodeId) {
            network.selectNodes([nodeId]);
            network.focus(nodeId, {
                scale: 1.2,
                animation: { duration: 800, easingFunction: 'easeInOutQuad' }
            });
            triggerHighlightForNode(nodeId);
        }

        var physicsEnabled = true;
        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            network.setOptions({{ physics: physicsEnabled }});
            let btn = document.getElementById('physics-toggle');
            if (physicsEnabled) {
                btn.innerText = "Freeze Physics: OFF";
                btn.classList.remove('frozen');
            } else {
                btn.innerText = "Freeze Physics: ON";
                btn.classList.add('frozen');
            }
        }

        function hexToRgb(hex) {
            let bigint = parseInt(hex.replace('#',''), 16);
            return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
        }
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }
        function updateColors() {
            let startHex = document.getElementById('color-start').value;
            let endHex = document.getElementById('color-end').value;
            let c1 = hexToRgb(startHex);
            let c2 = hexToRgb(endHex);

            let allNodesArr = nodes.get({returnType: "Object"});
            let ids = Object.keys(allNodesArr).sort();
            let n = ids.length;

            let updates = [];
            ids.forEach((id, idx) => {
                let t = n > 1 ? idx / (n - 1) : 0;
                let r = Math.round(c1[0] + (c2[0] - c1[0]) * t);
                let g = Math.round(c1[1] + (c2[1] - c1[1]) * t);
                let b = Math.round(c1[2] + (c2[2] - c1[2]) * t);
                let newColor = rgbToHex(r, g, b);

                let node = allNodesArr[id];
                node.color.border = newColor;
                updates.push(node);
            });
            nodes.update(updates);
        }

        let allNodes = nodes.get({returnType: "Object"});
        let allEdges = edges.get({returnType: "Object"});
        let activeSelectedNodeId = null;

        function resetHighlight() {
            let resetNodes = [];
            for (let nodeId in allNodes) {
                let node = allNodes[nodeId];
                node.opacity = 1.0;
                resetNodes.push(node);
            }
            let resetEdges = [];
            for (let edgeId in allEdges) {
                let edge = allEdges[edgeId];
                edge.color = { color: "#475569", opacity: 1.0 };
                edge.width = 2;
                resetEdges.push(edge);
            }
            nodes.update(resetNodes);
            edges.update(resetEdges);
            activeSelectedNodeId = null;
        }

        function triggerHighlightForNode(clickedNodeId) {
            if (activeSelectedNodeId === clickedNodeId) {
                resetHighlight();
                return;
            }
            activeSelectedNodeId = clickedNodeId;

            let connectedNodes = network.getConnectedNodes(clickedNodeId);
            connectedNodes.push(clickedNodeId);
            let connectedEdges = network.getConnectedEdges(clickedNodeId);

            let updateArrayNodes = [];
            for (let nodeId in allNodes) {
                let node = allNodes[nodeId];
                node.opacity = connectedNodes.includes(nodeId) ? 1.0 : 0.20;
                updateArrayNodes.push(node);
            }

            let updateArrayEdges = [];
            for (let edgeId in allEdges) {
                let edge = allEdges[edgeId];
                if (connectedEdges.includes(edgeId)) {
                    edge.color = { color: "#38bdf8", opacity: 1.0 };
                    edge.width = 3;
                } else {
                    edge.color = { color: "#1f2937", opacity: 0.15 };
                    edge.width = 1;
                }
                updateArrayEdges.push(edge);
            }

            nodes.update(updateArrayNodes);
            edges.update(updateArrayEdges);
        }

        network.on("click", function (params) {
            if (params.nodes.length > 0) {
                triggerHighlightForNode(params.nodes[0]);
            } else {
                resetHighlight();
            }
        });
    </script>
